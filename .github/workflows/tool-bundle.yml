name: Tool Bundle

on:
  push:
    paths:
      - '.github/workflows/tool-bundle.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download Android patch tools
        run: |
          set -eux
          mkdir -p tools
          curl -fL 'https://raw.githubusercontent.com/ViRb3/apk-utilities/master/bin/apktool_2.12.0.jar' -o tools/apktool.jar
          curl -fL 'https://raw.githubusercontent.com/ViRb3/apk-utilities/master/bin/baksmali-2.5.2.jar' -o tools/baksmali.jar
          curl -fL 'https://raw.githubusercontent.com/ViRb3/apk-utilities/master/bin/smali-2.5.2.jar' -o tools/smali.jar
          curl -fL 'https://raw.githubusercontent.com/ViRb3/apk-utilities/master/bin/uber-apk-signer-1.3.0.jar' -o tools/uber-apk-signer.jar
          sha256sum tools/*
      - uses: actions/upload-artifact@v4
        with:
          name: android-patch-tools
          path: tools
          retention-days: 1
