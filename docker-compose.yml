name: ff-legacy-server

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fflegacy}
    volumes:
      - pgdata:/var/lib/postgresql/data

  live:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "src/live.js"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LIVE_PORT:-19134}:${LIVE_PORT:-19134}"

  login:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "src/login.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      ACCOUNT_DATA_FILE: /account-data/accounts.json
    volumes:
      - accountdata:/account-data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LOGIN_PORT:-19132}:${LOGIN_PORT:-19132}"

  main:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "src/main.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      ACCOUNT_DATA_FILE: /account-data/accounts.json
    volumes:
      - accountdata:/account-data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MAIN_PORT:-19133}:${MAIN_PORT:-19133}"

  rooms:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "src/rooms.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      ROOMS_DATA_FILE: /data/rooms.json
    volumes:
      - roomdata:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ROOMS_PORT:-19135}:${ROOMS_PORT:-19135}"

  gateway:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "src/gateway.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      ACCOUNT_DATA_FILE: /account-data/accounts.json
    volumes:
      - accountdata:/account-data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TCP_PORT:-8084}:${TCP_PORT:-8084}/tcp"

  match:
    build:
      context: .
      dockerfile: docker/match.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ROOMS_INTERNAL_URL: http://rooms:${ROOMS_PORT:-19135}
    depends_on:
      - rooms
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GAME_SERVER_PORT:-10100}:${GAME_SERVER_PORT:-10100}/udp"

volumes:
  redisdata:
  pgdata:
  roomdata:
  accountdata:
